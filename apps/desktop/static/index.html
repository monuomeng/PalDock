<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>PalDock</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>PalDock</h1>
      <nav aria-label="主导航">
        <a href="#/attention" data-view="attention">待我处理 <span id="attention-count" class="badge" aria-label="待办数量"></span></a>
        <a href="#/chat" data-view="chat">对话</a>
        <a href="#/tasks" data-view="tasks">任务</a>
        <a href="#/new" data-view="new">新建任务</a>
        <a href="#/auto" data-view="auto">自动处理记录</a>
        <a href="#/settings" data-view="settings">设置</a>
      </nav>
      <p id="connection" class="down" role="status" aria-live="polite">本地服务启动中…</p>
      <p id="executor-warning" class="warning" role="status" aria-live="polite" hidden>有执行器断线，部分任务的执行状态待确认。</p>
    </header>
    <main id="content" tabindex="-1"></main>
    <script type="module" src="app/main.js"></script>
  </body>
</html>
